<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battleship</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Battleship</h1>
      <p class="status-row">
        <span id="turn" class="turn" hidden></span>
        <span id="status" class="status" aria-live="polite"></span>
      </p>
      <div class="settings">
        <label class="setting" for="ai-pace">
          AI pace
          <select id="ai-pace">
            <option value="human">Human-like (3–10 s)</option>
            <option value="quick">Quick (~0.5–1 s)</option>
          </select>
        </label>
        <button id="mute" type="button" class="mute" aria-pressed="false" aria-label="Sound" title="Sound">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor" />
            <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <path class="cross" d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="board-wrap">
        <h2>Your Fleet</h2>
        <div class="board-frame">
          <div id="player-board" class="board" role="grid" aria-label="Your fleet"></div>
        </div>
        <ul id="player-fleet" class="fleet"></ul>
      </section>

      <section class="board-wrap">
        <h2>Enemy Waters</h2>
        <div class="board-frame">
          <div id="enemy-board" class="board enemy" role="grid" aria-label="Enemy waters"></div>
        </div>
        <ul id="enemy-fleet" class="fleet"></ul>
      </section>
    </main>

    <div id="controls" class="controls">
      <button id="rotate" type="button">Rotate (R)</button>
      <button id="random" type="button">Randomize</button>
      <button id="undo" type="button">Undo</button>
      <button id="start" type="button" class="primary" disabled>Start Battle</button>
      <button id="new-game" type="button" hidden>New Game</button>
    </div>

    <div id="overlay" class="overlay" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-describedby="overlay-text">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <dl id="overlay-stats" class="stats"></dl>
        <p id="overlay-record" class="record"></p>
        <div class="dialog-actions">
          <button id="overlay-new" type="button" class="primary">Play Again</button>
          <button id="overlay-inspect" type="button">Inspect battlefield</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
